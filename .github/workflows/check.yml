name: conv1d SVE check
on: push
jobs:
  check:
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        v: ['2.13.0=cpu_generic*_5', '2.14.1=cpu_generic*']
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          run-install: false
      - run: lscpu | grep -E "Model name|Flags"
      - run: |
          pixi init -c conda-forge env
          cd env
          pixi add "python=3.12" "pytorch=${{ matrix.v }}"
          pixi list | grep -E "^(pytorch|libtorch) "
          pixi run python ../repro.py
          ONEDNN_VERBOSE=1 pixi run python -c "import torch, torch.nn.functional as F; F.conv1d(torch.rand(1, 2, 44103), torch.rand(2, 1, 4), groups=2)" || true
